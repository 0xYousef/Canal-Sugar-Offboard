# Local MongoDB (and optionally the gateway) in Docker.
#
#   docker compose up -d mongo     -> only the database, on 127.0.0.1:27019 (run the gateway yourself with npm start,
#                                     and set MONGODB_URI=mongodb://127.0.0.1:27019 in gateway/.env)
#   docker compose up -d --build   -> database + gateway on http://localhost:8787, reading the rest of gateway/.env
#
# The gateway container always talks to the "mongo" container, whatever MONGODB_URI says in .env (so your Atlas
# password in .env is never used here). Data lives in the mongo-data volume; `docker compose down -v` erases it.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["127.0.0.1:27019:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  gateway:
    build: .
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      PORT: "8787"
      TZ: Africa/Cairo
    ports: ["127.0.0.1:8787:8787"]

volumes:
  mongo-data:
